<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>研究業績の変遷</title>
<style>
:root {
  --bg:#F5F3ED;--bg2:#EDEBE3;--surface:#FFFFFF;--border:rgba(30,24,14,0.10);
  --text:#1A1814;--text2:#5A5648;--text3:#8A8274;--grid:rgba(30,24,14,0.07);
  --c1:#D4A03E;--c2:#4A8EC4;--c3:#3E9E6A;--c4:#7B6FC4;--c5:#C4705A;--c6:#7EBA3A;
  --hover-hl:rgba(74,142,196,0.12);--sel-hl:rgba(74,142,196,0.22);
  --maxw:100%;
  --mono:'SF Mono','Fira Code','Consolas',monospace;
  --sans:'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,-apple-system,system-ui,sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0E1420;--bg2:#121A2A;--surface:#1A2236;--border:rgba(200,220,255,0.10);
  --text:#E8E4D8;--text2:#9A98A0;--text3:#6A6870;--grid:rgba(200,220,255,0.06);
  --hover-hl:rgba(74,142,196,0.16);--sel-hl:rgba(74,142,196,0.28);
}}
:root[data-theme="light"]{--bg:#F5F3ED;--bg2:#EDEBE3;--surface:#FFFFFF;--border:rgba(30,24,14,0.10);--text:#1A1814;--text2:#5A5648;--text3:#8A8274;--grid:rgba(30,24,14,0.07);--hover-hl:rgba(74,142,196,0.12);--sel-hl:rgba(74,142,196,0.22);}
:root[data-theme="dark"]{--bg:#0E1420;--bg2:#121A2A;--surface:#1A2236;--border:rgba(200,220,255,0.10);--text:#E8E4D8;--text2:#9A98A0;--text3:#6A6870;--grid:rgba(200,220,255,0.06);--hover-hl:rgba(74,142,196,0.16);--sel-hl:rgba(74,142,196,0.28);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:17px;line-height:1.6;min-height:100vh;padding:0 0 48px;-webkit-font-smoothing:antialiased;}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;}
header{padding:28px 24px 20px;max-width:var(--maxw);margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:1px solid var(--border);}
header h1{font-size:26px;font-weight:600;letter-spacing:.01em;}
.header-meta{font-family:var(--mono);font-size:14.5px;color:var(--text3);letter-spacing:.04em;white-space:nowrap;}
.header-count{font-size:36.5px;font-weight:700;font-family:var(--mono);color:var(--c2);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:14px 24px;max-width:var(--maxw);margin:0 auto;border-bottom:1px solid var(--border);}
.legend-item{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--text2);}
.legend-swatch{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.chart-section{padding:20px 24px 0;max-width:var(--maxw);margin:0 auto;}
.chart-wrap{position:relative;width:100%;cursor:crosshair;}
#main-canvas{display:block;width:100%;height:260px;}
.year-tooltip{position:absolute;top:8px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-family:var(--mono);font-size:14.5px;color:var(--text2);pointer-events:none;opacity:0;transition:opacity .15s;min-width:155px;z-index:10;}
.year-tooltip.visible{opacity:1;}
.yt-year{font-size:23.5px;font-weight:700;color:var(--text);line-height:1.2;margin-bottom:6px;font-variant-numeric:tabular-nums;}
.yt-row{display:flex;justify-content:space-between;gap:8px;line-height:1.8;}
.yt-dot{display:inline-block;width:7px;height:7px;border-radius:1px;margin-right:4px;vertical-align:middle;margin-top:-1px;}
.yt-total{font-weight:700;color:var(--text);border-top:1px solid var(--border);margin-top:4px;padding-top:4px;}
.topic-section{max-width:var(--maxw);margin:0 auto;padding:0 24px;}
.topic-label{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);padding:10px 0 5px;}
.topic-grid{display:flex;overflow-x:auto;padding-bottom:2px;padding-left:42px;padding-right:8px;}
.topic-grid::-webkit-scrollbar{display:none;}
.topic-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;align-items:center;cursor:pointer;padding:2px 1px;border-radius:3px;transition:background .1s;}
.topic-col:hover{background:var(--hover-hl);}
.topic-col.selected{background:var(--sel-hl);}
.topic-chip{border-radius:3px;font-size:12px;font-weight:700;padding:2px 1px;white-space:nowrap;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);width:100%;text-align:center;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em;}
.topic-chip.empty{background:transparent;opacity:0;pointer-events:none;}
.topic-yr{font-family:var(--mono);font-size:12px;color:var(--text3);margin-top:2px;font-variant-numeric:tabular-nums;}
.detail-section{max-width:var(--maxw);margin:0 auto;padding:14px 24px 0;}
.detail-hdr{font-family:var(--mono);font-size:14.5px;color:var(--text3);letter-spacing:.05em;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.dhyr{font-size:28.5px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.dhtot{font-size:17px;color:var(--c2);font-weight:600;}
.detail-note{font-size:13px;color:var(--text3);margin-left:auto;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media(max-width:680px){.detail-grid{grid-template-columns:1fr;}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:13px 15px;}
.card-title{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--border);}
.prow{display:flex;align-items:baseline;justify-content:space-between;padding:5px 6px;border-bottom:1px solid var(--grid);gap:8px;cursor:pointer;border-radius:4px;margin:0 -6px;transition:background .1s;}
.prow:last-child{border-bottom:none;}
.prow:hover{background:var(--hover-hl);}
.prow.active{background:var(--sel-hl);}
.pname{font-size:17px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.pcnt{font-family:var(--mono);font-size:14.5px;color:var(--text3);font-variant-numeric:tabular-nums;white-space:nowrap;padding:1px 6px;background:var(--bg);border-radius:10px;flex-shrink:0;transition:background .1s,color .1s;}
.prow.active .pcnt{background:var(--c2);color:#fff;}
.kwlist{display:flex;flex-direction:column;gap:4px;}
.kwitem{display:flex;align-items:center;gap:8px;cursor:pointer;border-radius:4px;padding:4px 6px;margin:0 -6px;transition:background .1s;}
.kwitem:hover{background:var(--hover-hl);}
.kwitem.active{background:var(--sel-hl);}
.kwbar-wrap{flex:1;height:4px;background:var(--bg2);border-radius:2px;overflow:hidden;}
.kwbar{height:100%;border-radius:2px;}
.kwname{font-size:15.5px;color:var(--text);width:126px;flex-shrink:0;}
.kwcnt{font-family:var(--mono);font-size:13px;color:var(--text3);font-variant-numeric:tabular-nums;width:24px;text-align:right;flex-shrink:0;}
.nodata{font-size:14.5px;color:var(--text3);font-style:italic;padding:6px 0;}
/* ── 論文リスト ───── */
#ps{max-width:var(--maxw);margin:0 auto;padding:14px 24px 0;}
.ps-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--border);}
.ps-lbl{font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);}
.ps-yr{font-size:26px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.ps-tp{font-size:15.5px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);padding:2px 9px;border-radius:10px;letter-spacing:.02em;}
.ps-cnt{font-family:var(--mono);font-size:15.5px;color:var(--text3);}
.ps-clear{font-size:13px;color:var(--text3);cursor:pointer;padding:3px 10px;border:1px solid var(--border);border-radius:10px;background:transparent;font-family:var(--mono);transition:border-color .15s,color .15s;}
.ps-clear:hover{color:var(--text);border-color:var(--text3);}
.exp-group{margin-left:auto;display:flex;align-items:center;gap:6px;}
.exp-lbl{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);}
.exp-btn{font-family:var(--sans);font-size:12.5px;color:var(--text2);cursor:pointer;padding:4px 11px;border:1px solid var(--border);border-radius:10px;background:var(--surface);transition:border-color .15s,color .15s,background .15s;}
.exp-btn:hover{color:var(--c2);border-color:var(--c2);}
.exp-btn.done{color:#fff;background:var(--c3);border-color:var(--c3);}
.exp-btn.err{color:#fff;background:var(--c5);border-color:var(--c5);}
.exp-style{font-family:var(--sans);font-size:12.5px;color:var(--text2);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px 8px;cursor:pointer;outline:none;}
.exp-style:hover,.exp-style:focus{border-color:var(--c2);color:var(--text);}
.plist{display:flex;flex-direction:column;gap:18px;padding-bottom:40px;}
.cat-block{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.cat-hdr{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--border);}
.cat-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.cat-name{font-size:14.5px;font-weight:700;letter-spacing:.04em;color:var(--text2);}
.cat-cnt{font-family:var(--mono);font-size:14.5px;color:var(--text3);margin-left:auto;}
.paper-row{display:flex;align-items:baseline;gap:10px;padding:7px 14px;border-bottom:1px solid var(--grid);}
.paper-row:last-child{border-bottom:none;}
.ptitle{font-size:16px;color:var(--text);flex:1;line-height:1.5;}
.pmeta{font-size:13.5px;color:var(--text3);font-family:var(--mono);white-space:nowrap;flex-shrink:0;max-width:min(34vw,520px);overflow:hidden;text-overflow:ellipsis;}
.zlink{font-size:13px;color:var(--text3);text-decoration:none;flex-shrink:0;padding:1px 5px;border:1px solid var(--border);border-radius:3px;font-family:var(--mono);transition:color .1s,border-color .1s;}
.zlink:hover{color:var(--c2);border-color:var(--c2);}
@media(max-width:680px){.paper-row{flex-wrap:wrap;gap:3px;}.pmeta{max-width:100%;white-space:normal;}}
/* ── 意味検索 ───── */
.search-section{padding:16px 24px 0;}
.search-box{display:flex;gap:8px;align-items:center;}
.search-input{flex:1;font-family:var(--sans);font-size:17.5px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;outline:none;transition:border-color .15s;}
.search-input:focus{border-color:var(--c2);}
.search-input::placeholder{color:var(--text3);}
.search-btn{font-family:var(--sans);font-size:16px;font-weight:600;color:#fff;background:var(--c2);border:none;border-radius:8px;padding:10px 18px;cursor:pointer;white-space:nowrap;transition:opacity .15s;flex-shrink:0;}
.search-btn:hover{opacity:.88;}
.search-btn:disabled{opacity:.5;cursor:default;}
.search-clear{font-size:13px;color:var(--text3);cursor:pointer;padding:3px 10px;border:1px solid var(--border);border-radius:10px;background:transparent;font-family:var(--mono);transition:border-color .15s,color .15s;flex-shrink:0;}
.search-clear:hover{color:var(--text);border-color:var(--text3);}
.search-status{font-family:var(--mono);font-size:13.5px;color:var(--text3);padding:7px 2px 0;min-height:14px;}
.search-status.err{color:var(--c5);}
.sr-row{display:flex;align-items:baseline;gap:10px;padding:7px 14px;border-bottom:1px solid var(--grid);}
.sr-row:last-child{border-bottom:none;}
.sr-score{font-family:var(--mono);font-size:13.5px;color:var(--c2);font-variant-numeric:tabular-nums;width:34px;flex-shrink:0;text-align:right;}
@media(max-width:680px){.sr-row{flex-wrap:wrap;gap:3px;}}
</style>
<header>
  <div>
    <div id="hdrEyebrow" style="font-size:14.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:3px"></div>
    <h1 id="hdrTitle"></h1>
  </div>
  <div style="text-align:right">
    <div class="header-count" id="hdrCount">–</div>
    <div class="header-meta" id="hdrRange">件</div>
  </div>
</header>
<div class="legend wrap">
  <div class="legend-item"><span class="legend-swatch" style="background:var(--c1)"></span>I. 著書</div>
  <div class="legend-item"><span class="legend-swatch" style="background:var(--c2)"></span>II. 学術論文</div>
  <div class="legend-item"><span class="legend-swatch" style="background:var(--c3)"></span>III. 国際会議</div>
  <div class="legend-item"><span class="legend-swatch" style="background:var(--c4)"></span>IV. 国内会議・研究会</div>
  <div class="legend-item"><span class="legend-swatch" style="background:var(--c5)"></span>V. 解説記事・その他</div>
  <div class="legend-item"><span class="legend-swatch" style="background:var(--c6)"></span>VI. 特許</div>
</div>
<div class="search-section wrap">
  <div class="search-box">
    <input type="text" id="ssInput" class="search-input" placeholder="意味検索（例：高齢者の見守りセンサ、災害時の情報配信、活動量推定）" autocomplete="off">
    <button id="ssBtn" class="search-btn">検索</button>
    <button id="ssClearBtn" class="search-clear" style="display:none">✕ クリア</button>
  </div>
  <div id="ssStatus" class="search-status"></div>
</div>
<div id="ss" class="wrap" style="display:none;padding-top:10px;">
  <div class="ps-hdr">
    <span class="ps-lbl">意味検索の結果</span>
    <span id="ss-q" class="ps-yr" style="font-size:19.5px"></span>
    <span id="ss-cnt" class="ps-cnt"></span>
    <span class="exp-group">
      <span class="exp-lbl">エクスポート</span>
      <select class="exp-style" onchange="setCiteStyle(this.value)" title="引用スタイル"></select>
      <button class="exp-btn" onclick="exportResults('md',this,'ss')" title="参考文献リスト（テキスト）をダウンロード">テキスト</button>
      <button class="exp-btn" onclick="exportResults('bib',this,'ss')" title="BibTeX形式でダウンロード">BibTeX</button>
      <button class="exp-btn" onclick="exportResults('copy',this,'ss')" title="Markdownをクリップボードにコピー">コピー</button>
    </span>
  </div>
  <div class="plist"><div class="cat-block" id="srlist"></div></div>
</div>
<div class="chart-section">
  <div class="chart-wrap" id="cwrap">
    <canvas id="mc"></canvas>
    <div class="year-tooltip" id="tt">
      <div class="yt-year" id="tt-yr"></div>
      <div id="tt-rows"></div>
      <div class="yt-row yt-total"><span>合計</span><span id="tt-tot"></span></div>
    </div>
  </div>
</div>
<div class="topic-section">
  <div class="topic-label">研究トピックの変遷（論文タイトルから自動抽出）</div>
  <div class="topic-grid" id="tgrid"></div>
</div>
<div class="detail-section">
  <div class="detail-hdr">
    <span id="dyr" class="dhyr"></span>
    <span id="dtot" class="dhtot"></span>
    <span class="detail-note" id="dhint">バーまたはトピックをクリックで固定</span>
  </div>
  <div class="detail-grid">
    <div class="card">
      <div class="card-title">主要共著者 Top 5</div>
      <div id="coa-list"></div>
    </div>
    <div class="card">
      <div class="card-title">頑張った学生 Top 5</div>
      <div id="stu-list"></div>
    </div>
    <div class="card">
      <div class="card-title">研究トピック</div>
      <div id="kw-list" class="kwlist"></div>
    </div>
  </div>
</div>
<div id="ps" style="display:none">
  <div class="ps-hdr">
    <span class="ps-lbl">論文リスト</span>
    <span id="ps-yr" class="ps-yr"></span>
    <span id="ps-tp" class="ps-tp" style="display:none"></span>
    <span id="ps-cnt" class="ps-cnt"></span>
    <span class="exp-group">
      <span class="exp-lbl">エクスポート</span>
      <select class="exp-style" onchange="setCiteStyle(this.value)" title="引用スタイル"></select>
      <button class="exp-btn" onclick="exportResults('md',this,'ps')" title="参考文献リスト（テキスト）をダウンロード">テキスト</button>
      <button class="exp-btn" onclick="exportResults('bib',this,'ps')" title="BibTeX形式でダウンロード">BibTeX</button>
      <button class="exp-btn" onclick="exportResults('copy',this,'ps')" title="Markdownをクリップボードにコピー">コピー</button>
    </span>
    <button class="ps-clear" onclick="clearPS()">✕ クリア</button>
  </div>
  <div class="plist" id="plist"></div>
</div>
<script>
/* ══════════════════════════════════════════════════════════
   利用者ごとの設定 — fork したらここだけ書き換える
   ══════════════════════════════════════════════════════════ */
const CFG={
  // 見出しに出る氏名（空にすると氏名を出さず副題だけになる）
  ownerName:'荒川 豊',
  // 氏名の後ろに続く副題
  subtitle:'研究業績の変遷',
  // 小さく出る英字ラベル
  eyebrow:'Research Output Timeline',
  // Zotero の「ユーザー名」。zotero.org/settings/account で確認できる。
  // 各論文の「Z↗」リンクに使う。空にするとリンク自体を表示しない。
  // ※数値のユーザーIDではリンクが 404 になるので必ずユーザー名を入れる
  zoteroUsername:'yarakawa',
};

/* ── 意味検索（Transformers.js, ブラウザ内Embedding） ───── */
const SS_MODEL='Xenova/multilingual-e5-small';
const SS_DB='pubsearch-v1',SS_STORE='embeddings';
let SS_KEY=SS_MODEL+':'+((D.papers||[]).length);
let ssEmbedder=null,ssTitleVecs=null,ssDim=384,ssBusy=false;
function ssStatus(msg,isErr){const el=document.getElementById('ssStatus');el.textContent=msg||'';el.className='search-status'+(isErr?' err':'');}
function ssHide(){document.getElementById('ss').style.display='none';document.getElementById('ssClearBtn').style.display='none';}
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(SS_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(SS_STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbGet(key){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction(SS_STORE,'readonly'),rq=tx.objectStore(SS_STORE).get(key);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
async function idbPut(key,val){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction(SS_STORE,'readwrite');tx.objectStore(SS_STORE).put(val,key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function ssEnsureReady(){
  if(ssTitleVecs)return;
  ssStatus('モデルを読み込み中…（初回のみ、約120MB / 以後はキャッシュされます）');
  const {pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0/dist/transformers.min.js');
  env.allowLocalModels=false;
  ssEmbedder=await pipeline('feature-extraction',SS_MODEL,{dtype:'q8',
    progress_callback:p=>{if(p.status==='progress')ssStatus(`モデルを読み込み中… ${Math.round(p.progress||0)}%`);}
  });
  const papers=D.papers||[];
  const cached=await idbGet(SS_KEY).catch(()=>null);
  if(cached&&cached.count===papers.length){
    ssTitleVecs=new Float32Array(cached.buf);ssDim=cached.dim;
    ssStatus(`準備完了（${papers.length}件のタイトルをキャッシュから読込）`);
    return;
  }
  ssStatus(`論文タイトルをベクトル化中… 0/${papers.length}`);
  const BATCH=32,chunks=[];
  for(let i=0;i<papers.length;i+=BATCH){
    const texts=papers.slice(i,i+BATCH).map(p=>'passage: '+p.t);
    const out=await ssEmbedder(texts,{pooling:'mean',normalize:true});
    chunks.push(out.data);
    ssDim=out.dims[out.dims.length-1];
    ssStatus(`論文タイトルをベクトル化中… ${Math.min(i+BATCH,papers.length)}/${papers.length}`);
  }
  ssTitleVecs=new Float32Array(papers.length*ssDim);
  let off=0;chunks.forEach(c=>{ssTitleVecs.set(c,off);off+=c.length;});
  await idbPut(SS_KEY,{count:papers.length,dim:ssDim,buf:ssTitleVecs.buffer.slice(0)}).catch(()=>{});
  ssStatus(`準備完了（${papers.length}件のタイトルをベクトル化しました）`);
}
async function doSearch(){
  const q=document.getElementById('ssInput').value.trim();
  if(!q||ssBusy)return;
  ssBusy=true;
  const btn=document.getElementById('ssBtn');btn.disabled=true;
  psYear=null;psTopic=null;psAuthor=null;
  document.getElementById('ps').style.display='none';
  try{
    await ssEnsureReady();
    const qout=await ssEmbedder('query: '+q,{pooling:'mean',normalize:true});
    const qv=qout.data;
    const papers=D.papers||[];
    const scored=papers.map((p,i)=>{
      let dot=0;const base=i*ssDim;
      for(let d=0;d<ssDim;d++)dot+=qv[d]*ssTitleVecs[base+d];
      return{p,score:dot};
    });
    scored.sort((a,b)=>b.score-a.score);
    renderSearchResults(q,scored.slice(0,30));
    ssStatus('準備完了');
  }catch(e){
    console.error(e);
    ssStatus('検索エンジンの読み込みに失敗しました。file://で直接開いている場合はローカルサーバー経由（例: python3 -m http.server）で開き直してください。',true);
  }finally{
    ssBusy=false;btn.disabled=false;
  }
}
function renderSearchResults(q,top){
  ssResults=top;ssQuery=q;
  document.getElementById('ss-q').textContent='"'+q+'"';
  document.getElementById('ss-cnt').textContent=top.length+'件';
  const rows=top.map(({p,score})=>{
    const auth=fmtAuth(p),pct=Math.max(0,Math.round(score*100));
    const zl=ZBASE?`<a class="zlink" href="${ZBASE+p.k}" target="_blank" title="Zoteroで開く">Z↗</a>`:'';
    return`<div class="sr-row"><span class="sr-score">${pct}%</span><span class="ptitle">${p.t}</span><span class="pmeta">${auth}・${p.y}・${p.c}</span>${zl}</div>`;
  }).join('');
  document.getElementById('srlist').innerHTML=rows||'<div class="nodata">該当する論文が見つかりませんでした</div>';
  document.getElementById('ssClearBtn').style.display='';
  const el=document.getElementById('ss');
  el.style.display='block';
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function clearSearch(){
  ssHide();
  document.getElementById('ssInput').value='';
  ssStatus('');

// BibTeX のエントリ種別（Zotero の itemType から対応付け）
const BIBTYPE={journalArticle:'article',conferencePaper:'inproceedings',presentation:'inproceedings',
  magazineArticle:'article',book:'book',bookSection:'incollection',patent:'patent',report:'techreport',thesis:'phdthesis'};
// 掲載先を入れるフィールド名（@article は journal、それ以外は booktitle）
const VENUEFIELD=t=>(t==='article'?'journal':(t==='book'||t==='techreport'||t==='phdthesis'?'series':'booktitle'));
function bibEscape(s){return String(s||'').replace(/[\\]/g,'\\textbackslash ').replace(/([&%$#_])/g,'\\$1').replace(/[{}]/g,'').replace(/\s+/g,' ').trim();}
function bibKey(p,used){
  // 筆頭著者のローマ字姓（ra）を優先。無ければ ASCII 姓 → タイトル中の英単語 → Zotero キー
  const ascii=s=>String(s||'').replace(/[^\x20-\x7E]/g,' ').trim();
  let a=(p.ra||'').replace(/[^A-Za-z]/g,'');
  if(!a)a=(ascii(p.a&&p.a[0]).split(/[\s,]+/).filter(Boolean)[0]||'').replace(/[^A-Za-z]/g,'');
  if(!a){const w=ascii(p.t).split(/[^A-Za-z]+/).filter(x=>x.length>3);a=w[0]||'';}
  let base=((a||p.k).toLowerCase()+(p.y||'')).replace(/[^a-z0-9]/g,'');
  if(!base)base='ref';
  let key=base,n=2;
  while(used.has(key)){key=base+String.fromCharCode(95)+(n++);}
  used.add(key);return key;
}
function toBibtex(list,header){
  const used=new Set();
  const body=list.map(p=>{
    const type=BIBTYPE[p.it]||'misc',key=bibKey(p,used),F=[];
    F.push(['author',(p.a||[]).join(' and ')]);
    F.push(['title',p.t]);
    F.push(['year',p.y]);
    if(p.v)F.push([VENUEFIELD(type),p.v]);
    if(p.vl)F.push(['volume',p.vl]);
    if(p.is)F.push(['number',p.is]);
    if(p.pg)F.push(['pages',p.pg]);
    if(p.pb)F.push(['publisher',p.pb]);
    if(p.doi)F.push(['doi',p.doi]);
    if(p.u)F.push(['url',p.u]);
    F.push(['note',p.c]);           // 業績区分（I.著書 / III.国際会議 など）
    const fields=F.filter(([,v])=>v!==''&&v!=null)
      .map(([k,v])=>`  ${k} = {${k==='title'?'{'+bibEscape(v)+'}':bibEscape(v)}}`).join(',\n');
    return `@${type}{${key},\n${fields}\n}`;
  }).join('\n\n');
  return `% ${header}\n% ${OWNER}より出力\n\n${body}\n`;
}
/* ── 引用スタイル（IEEE / ACM / IPSJ / IEICE）───── */
const hasCJK=s=>/[　-〿぀-ヿ一-鿿＀-￯]/.test(s||'');
const DASH='–';  // en dash（ページ範囲用）
// 保存形式は「姓 名」。{sur, given} に分解する
function splitName(en){
  const t=String(en||'').trim().split(/\s+/).filter(Boolean);
  if(!t.length)return null;
  if(t.length===1)return{sur:t[0],given:''};
  return{sur:t[0],given:t.slice(1).join(' ')};
}
const initials=g=>String(g||'').split(/[\s\-]+/).filter(Boolean).map(w=>w[0].toUpperCase()+'.').join(' ');
// 各スタイルの著者名表記。ローマ字が無い（日本語のみの）著者はそのまま日本語で出す
function nameAs(p,i,mode){
  const ja=(p.a||[])[i]||'', en=(p.ae||[])[i]||'';
  const n=splitName(en);
  if(!n||hasCJK(en)){
    // ローマ字が無い場合：日本語スタイルはそのまま、欧文スタイルでも日本語表記で代替
    return ja||en;
  }
  const ini=initials(n.given);
  switch(mode){
    case 'ieee':  return (ini?ini+' ':'')+n.sur;            // Y. Arakawa
    case 'acm':   return (n.given?n.given+' ':'')+n.sur;     // Yutaka Arakawa
    case 'ipsj':  return n.sur+(ini?', '+ini:'');            // Arakawa, Y.
    case 'ieice': return (ini?ini+' ':'')+n.sur;             // Y. Arakawa
  }
  return ja||en;
}
function joinAuthors(p,mode){
  const n=(p.a||[]).length;
  let names;
  // 和文誌スタイル×和文タイトルは、著者名も日本語で統一する（和英混在を防ぐ）
  if((mode==='ipsj'||mode==='ieice')&&hasCJK(p.t)){
    names=(p.a||[]).slice();
  }else{
    names=[];for(let i=0;i<n;i++)names.push(nameAs(p,i,mode));
  }
  names=names.filter(Boolean);
  if(!names.length)return '';
  const jp=names.every(hasCJK);
  if(mode==='ieee'){
    if(names.length>6)return names[0]+' et al.';
    if(names.length===1)return names[0];
    return names.slice(0,-1).join(', ')+(names.length>2?', and ':' and ')+names[names.length-1];
  }
  if(mode==='acm'){
    if(names.length===1)return names[0];
    return names.slice(0,-1).join(', ')+(names.length>2?', and ':' and ')+names[names.length-1];
  }
  if(mode==='ipsj'){
    // 和文は「, 」、英文は "and" で連結
    if(jp)return names.join(', ');
    if(names.length===1)return names[0];
    return names.slice(0,-1).join(', ')+' and '+names[names.length-1];
  }
  return names.join(', ');   // ieice
}
function pageStr(pg){return String(pg||'').replace(/\s*-{1,2}\s*/,DASH);}
// 1件を指定スタイルの参考文献表記に整形する
function formatCitation(p,mode){
  // 題目末尾の句点は、後ろに付ける記号と重複するため落とす
  const A=joinAuthors(p,mode), T=String(p.t||'').replace(/[.,、。]+$/,''), Y=p.y||'', V=p.v||'';
  const isJournal=(p.it==='journalArticle'||p.it==='magazineArticle');
  const pg=pageStr(p.pg), vol=p.vl||'', no=p.is||'', doi=p.doi||'';
  const jp=hasCJK(T);
  const bits=[];
  if(mode==='ieee'){
    let s=(A?A+', ':'')+`"${T},"`;
    if(V)s+=isJournal?` ${V},`:` in Proc. ${V},`;
    if(vol)s+=` vol. ${vol},`;
    if(no)s+=` no. ${no},`;
    // IEEE は会議録では「年→ページ」、雑誌では「ページ→年」の順
    if(isJournal){
      if(pg)s+=` pp. ${pg},`;
      s+=` ${Y}.`;
    }else{
      s+=` ${Y},`;
      if(pg)s+=` pp. ${pg},`;
      s=s.replace(/,$/,'.');
    }
    if(doi)s+=` doi: ${doi}.`;
    return s.replace(/,\s*\./g,'.');
  }
  if(mode==='acm'){
    let s=(A?A+'. ':'')+`${Y}. ${T}.`;
    if(V)s+=isJournal?` ${V}`:` In Proceedings of ${V}`;
    if(isJournal){
      if(vol)s+=` ${vol}`+(no?`, ${no}`:'');
      s+=` (${Y})`;                       // 巻号の後に年（ACM は雑誌のみ）
      if(pg)s+=`, ${pg}`;
    }else if(pg){
      s+=`, ${pg}`;
    }
    s+='.';
    if(doi)s+=` https://doi.org/${doi}`;
    return s.replace(/\s+/g,' ').replace(/\.\s*\./g,'.');
  }
  if(mode==='ipsj'){
    // 和文: 著者: 題目, 誌名, Vol.x, No.y, pp.a–b (年).
    let s=(A?A+': ':'')+T+',';
    if(V)s+=` ${V},`;
    if(vol)s+=` Vol.${vol},`;
    if(no)s+=` No.${no},`;
    if(pg)s+=` pp.${pg}`;
    s=s.replace(/,$/,'');
    s+=` (${Y}).`;
    return s.replace(/,\s*\(/,' (');
  }
  // ieice: 著者, "題目," 誌名, vol.x, no.y, pp.a–b, 年.
  let s=(A?A+', ':'')+(jp?`"${T}," `:`"${T}," `);
  if(V)s+=`${V}, `;
  if(vol)s+=`vol.${vol}, `;
  if(no)s+=`no.${no}, `;
  if(pg)s+=`pp.${pg}, `;
  s+=`${Y}.`;
  return s.replace(/,\s*,/g,',');
}
// 参考文献リスト（Word にそのまま貼れるプレーンテキスト）
function toCitationList(list,header,scores,mode){
  const lines=list.map((p,i)=>{
    const sc=scores&&scores[i]!=null?`  [類似度 ${scores[i]}%]`:'';

  const label=(CITE_STYLES.find(s=>s.id===mode)||{}).label||mode;
  return `${header}\n${OWNER} / ${list.length}件 / ${label} スタイル\n\n${lines}\n`;
}
function download(name,text,mime){

function exportResults(kind,btn,src){

  }
  slug=(slug||'export').replace(/[\\\/:*?"<>|\s]+/g,'_').slice(0,40);
  const stamp=new Date().toISOString().slice(0,10);
  if(kind==='bib'){
    download(`pubs_${slug}_${stamp}.bib`,toBibtex(list,header),'text/plain');

function draw(){
  const dpr=window.devicePixelRatio||1,W=mc.parentElement.clientWidth;
  // 画面が広いほどグラフも縦に伸ばし、横長で潰れないようにする
  const H=Math.max(260,Math.min(440,Math.round(W*0.26)));
  mc.width=W*dpr;mc.height=H*dpr;mc.style.width=W+'px';mc.style.height=H+'px';ctx.scale(dpr,dpr);
  const N=D.years.length,PL=42,PR=8,PT=16,PB=34,cW=W-PL-PR,cH=H-PT-PB;
  const mx=Math.max(...D.years.map(y=>{const d=D.year_by_col[y]||{};return COLS.reduce((s,c)=>s+(d[c]||0),0);}));
  const gap=Math.max(2,cW/N*.08),bw=(cW-gap*(N-1))/N;
  bars=[];ctx.clearRect(0,0,W,H);
  [25,50,75,100].forEach(v=>{
    if(v>mx+5)return;
    const y=PT+cH-(v/(mx*1.05))*cH;
    ctx.strokeStyle=cv('--grid');ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(PL,y);ctx.lineTo(W-PR,y);ctx.stroke();
    ctx.fillStyle=cv('--text3');ctx.font=`13px ${cv('--mono')||'monospace'}`;ctx.textAlign='right';ctx.fillText(v,PL-6,y+4);
  });
  D.years.forEach((yr,i)=>{
    const x=PL+i*(bw+gap),d=D.year_by_col[yr]||{},tot=COLS.reduce((s,c)=>s+(d[c]||0),0);
    let sy=PT+cH;const isH=hov===i,isP=pin===i;
    if(isH||isP){ctx.fillStyle=isP?cv('--sel-hl'):cv('--hover-hl');ctx.fillRect(x-2,PT-4,bw+4,cH+4);}
    COLS.forEach((col,ci)=>{
      const v=d[col]||0;if(!v)return;
      const bh=(v/(mx*1.05))*cH;
      ctx.fillStyle=gc(ci);ctx.globalAlpha=(isH||isP)?1:.88;
      ctx.beginPath();
      if(ctx.roundRect)ctx.roundRect(x,sy-bh,bw,bh,[ci===0?2:0,ci===0?2:0,0,0]);
      else ctx.rect(x,sy-bh,bw,bh);
      ctx.fill();ctx.globalAlpha=1;sy-=bh;
    });
    bars.push({x,w:bw,yr,i,tot});
    ctx.fillStyle=cv('--text3');ctx.font=`13px ${cv('--mono')||'monospace'}`;ctx.textAlign='center';
    ctx.fillText(String(yr).slice(2),x+bw/2,H-10);
  });
}
